services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${JUPYTER_PORT:-8889}:8888"   # Jupyter Lab
      - "${VNC_PORT:-6081}:6080"        # Visualizador del scraper (VNC)
      - "${SPARK_UI_PORT:-4041}:4040"   # Spark UI
      - "${STREAMLIT_PORT:-8501}:8501"   # Dashboard Streamlit
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=
      - JUPYTER_PASSWORD=iicg2026
      - JUPYTER_ALLOW_INSECURE_WRITES=true
      - MONGODB_URI=${MONGODB_URI:-mongodb://database:27017/}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-proyecto_bigdata}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-union_semana7}
      - MONGODB_PROCESSED_COLLECTION=${MONGODB_PROCESSED_COLLECTION:-processed_data}
    depends_on:
      - database
    restart: always
    networks:
      - bigdata_net

  processor:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "/home/jovyan/work/src/hito2_processor.py"]
    volumes:
      - .:/home/jovyan/work
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://database:27017/}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-proyecto_bigdata}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-union_semana7}
      - MONGODB_PROCESSED_COLLECTION=${MONGODB_PROCESSED_COLLECTION:-processed_data}
    depends_on:
      - database
    profiles:
      - hito2
    networks:
      - bigdata_net

  database:
    image: mongo:latest
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - bigdata_net

  admin-db:
    image: mongo-express:latest
    ports:
      - "${MONGO_EXPRESS_PORT:-8083}:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://database:27017/
    depends_on:
      - database
    restart: always
    networks:
      - bigdata_net

networks:
  bigdata_net:
    driver: bridge

volumes:
  mongo_data:
